<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя разношёрстная стая — редакция</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.65;color:#2d3436;background:#f9f9f7}
header{background:#f5f1e8;padding:2.5rem 1.5rem;border-bottom:1px solid #e0d9ce}.header-content{max-width:1100px;margin:auto}.logo{font-size:2rem;font-weight:700}.tagline{color:#636e72}
.container{max-width:1100px;margin:auto;padding:2rem 1rem}.article{background:#fff;padding:2rem;margin-bottom:2rem;border-left:4px solid #e17055;border-radius:6px}.cover{position:relative;margin-bottom:1.5rem}.cover img{width:100%;max-height:520px;object-fit:cover;border-radius:6px;display:block}.cover-title{position:absolute;left:24px;right:24px;bottom:24px;margin:0;padding:.65rem .85rem;background:rgba(0,0,0,.62);color:#fff;font-size:clamp(1.35rem,3.2vw,2.35rem);font-weight:800;line-height:1.15;border-radius:5px;text-shadow:0 1px 2px rgba(0,0,0,.35)}.meta{color:#777;font-size:.9rem}.article-content{margin-top:1rem}.article-content h2{margin-top:1.7rem}.workflow{margin-top:1.5rem;padding:1rem;background:#faf7f2;border:1px solid #e0d9ce;border-radius:6px}.status{padding:.7rem .9rem;border-radius:5px;font-weight:600;margin-bottom:.8rem;background:#f5f1e8}.status.revision{background:#fff4df;color:#8a6500}.status.zen{background:#eaf6ee;color:#2d7a46}.status.published{background:#eaf6ee;color:#2d7a46}.buttons{display:flex;gap:.6rem;flex-wrap:wrap}.button{padding:.7rem 1rem;border:1px solid #d6cec2;border-radius:5px;background:#fff;cursor:pointer;font-weight:600}.button.dzen{background:#e17055;color:#fff;border-color:#e17055}.rework-form{display:none;margin-top:.8rem}.rework-form textarea{width:100%;min-height:110px;padding:.75rem;font:inherit;border:1px solid #d6cec2;border-radius:5px}.empty{background:#fff;padding:3rem;text-align:center;color:#636e72;border-radius:6px}.error{background:#fff0f0;color:#9a3030;padding:1rem;border-radius:6px}
</style>
</head>
<body>
<header><div class="header-content"><div class="logo">🐾 Моя разношёрстная стая</div><div class="tagline">Предпросмотр материалов редакции</div></div></header>
<main class="container"><div id="content"><div class="empty">Загрузка материалов…</div></div></main>
<script>
const API="https://dzen-publisher.sng216.workers.dev";
let articles=[];
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function statusInfo(a){
 if(a.status==="revision") return ["На доработке","revision"];
 if(a.status==="zen_ready") return ["Передано в Дзен · ожидает публикации","zen"];
 if(a.status==="published") return ["Опубликовано в Дзен · "+(a.published_at?new Date(a.published_at).toLocaleDateString("ru-RU"):""),"published"];
 if(a.status==="approved") return ["Одобрено Натальей · ожидает передачи","zen"];
 return ["На проверке",""];
}
function render(){
 const root=document.getElementById("content");
 if(!articles.length){root.innerHTML='<div class="empty">Сейчас нет материалов, допущенных в предпросмотр. Черновики и тестовые записи сюда не попадают.</div>';return}
 root.innerHTML=articles.map((a,i)=>{
  const [label,cls]=statusInfo(a);
  const decisionStage=(a.status==="site"||a.status==="review");
  const locked=!decisionStage;
  return '<article class="article">'+(a.image_url?'<div class="cover"><img src="'+esc(a.image_url)+'" alt="'+esc(a.title)+'"><div class="cover-title">'+esc(a.title)+'</div></div>':"")+
   '<h1>'+esc(a.title)+'</h1><div class="meta">'+esc(a.description||"")+'</div><div class="article-content">'+(a.content_html||"")+'</div>'+
   '<div class="workflow"><div id="status-'+i+'" class="status '+cls+'" style="display:'+(decisionStage?"none":"block")+'">'+label+'</div>'+
   (decisionStage?'<div class="buttons" id="buttons-'+i+'"><button class="button dzen" onclick="decision('+i+',\'dzen\')">Передать в Дзен</button><button class="button" onclick="showRework('+i+')">На доработку</button></div><div class="rework-form" id="form-'+i+'"><textarea id="comments-'+i+'" placeholder="Что нужно исправить, уточнить или переделать?"></textarea><button class="button" onclick="decision('+i+',\'rework\')">Отправить замечания</button></div>':'')+
   '<div id="result-'+i+'" class="meta"></div></div></article>';
 }).join("");
}
function showRework(i){document.getElementById("form-"+i).style.display="block";document.getElementById("comments-"+i).focus()}
async function decision(i,kind){
 const a=articles[i], result=document.getElementById("result-"+i);
 let comments="";
 if(kind==="rework"){comments=document.getElementById("comments-"+i).value.trim();if(!comments){result.textContent="Нужно указать замечания.";return}}
 result.textContent="Передаём решение…";
 try{
  const r=await fetch(API+"/api/articles/"+encodeURIComponent(a.id)+"/decision",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({decision:kind,comments,title:a.title})});
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error(data.error||("HTTP "+r.status));
  await load();
 }catch(e){result.textContent="Решение не принято: "+e.message}
}
async function load(){
 try{
  const r=await fetch(API+"/api/articles",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  articles=(await r.json()).filter(a=>["site","review"].includes(a.status));
  render();
 }catch(e){document.getElementById("content").innerHTML='<div class="error">Не удалось загрузить редакционный предпросмотр: '+esc(e.message)+'</div>'}
}
load();
setInterval(load,30000);
</script>
</body>
</html>
